<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriSmart AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card" id="upload-section">
      <h2>Scan Crop</h2>
      <input type="file" id="image-input" accept="image/png, image/jpeg" capture="environment" />
      <img id="preview" class="preview hidden" alt="Selected crop image" />
      <button id="submit-btn" disabled>Analyze</button>
      <p id="upload-error" class="error hidden"></p>
    </section>

    <section class="card hidden" id="result-section" aria-live="polite">
      <h2>Result</h2>
      <div id="result-body"></div>
    </section>

    <section class="card" id="weather-section">
      <h2>Weather &amp; Irrigation</h2>
      <div id="weather-body">Loading…</div>
    </section>

    <section class="card hidden" id="sustainability-section">
      <h2>Sustainability Score</h2>
      <div id="sustainability-body"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
