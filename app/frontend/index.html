<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgriSmart AI — Crop diagnosis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .topbar {
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(24px) saturate(170%);
    -webkit-backdrop-filter: blur(24px) saturate(170%);
    background: linear-gradient(180deg, rgba(6,17,10,0.82), rgba(6,17,10,0.58));
    border-bottom: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 8px 28px -8px rgba(0,0,0,0.5);
  }
  .topbar__inner {
    max-width: 880px; margin: 0 auto; padding: 15px 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 32px;
  }

  .wordmark {
    font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600;
    display: flex; align-items: center; gap: 11px;
    letter-spacing: -0.01em; white-space: nowrap;
  }
  .wordmark .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--paper-faint); flex-shrink: 0;
    transition: background-color 0.5s var(--ease), box-shadow 0.5s var(--ease);
  }
  .wordmark .dot.ok   { background: var(--moss);  box-shadow: 0 0 14px rgba(138,198,114,0.85); }
  .wordmark .dot.down { background: var(--brick); box-shadow: 0 0 14px rgba(232,138,107,0.8); }

  .topbar__right { display: flex; align-items: center; gap: 22px; }

  .topbar__divider {
    width: 1px; height: 30px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.16), transparent);
    flex-shrink: 0;
  }

  .userchip { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 0.88rem; font-weight: 700; color: #071308;
    background: linear-gradient(145deg, #A9DB90, var(--moss-deep));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 4px 12px -2px rgba(78,127,60,0.4);
  }
  .userchip__meta { line-height: 1.3; }
  .userchip__meta b { font-size: 0.89rem; font-weight: 600; display: block; white-space: nowrap; }
  .userchip__meta span { font-size: 0.76rem; color: var(--paper-faint); }

  main { max-width: 880px; margin: 0 auto; padding: 46px 28px 100px; animation: fadeUp 0.6s var(--ease); }

  .hero { margin-bottom: 34px; }
  .hero h2 { font-size: clamp(1.6rem, 4.4vw, 2.3rem); line-height: 1.2; max-width: 22ch; }
  .hero p { color: var(--paper-dim); margin: 15px 0 0; max-width: 52ch; font-size: 1rem; }

  .upload-card { padding: 22px; }
  .dropzone {
    display: block; width: 100%; cursor: pointer;
    border: 1.6px dashed rgba(255,255,255,0.22);
    border-radius: 21px; padding: 46px 20px; text-align: center;
    background: rgba(255,255,255,0.015);
    transition: border-color 0.35s var(--ease), background-color 0.35s var(--ease), transform 0.35s var(--ease);
  }
  .dropzone:hover, .dropzone.drag {
    border-color: rgba(138,198,114,0.7);
    background: rgba(138,198,114,0.07);
  }
  .dropzone.drag { transform: scale(1.012); border-style: solid; }
  .dropzone input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .dz-icon {
    font-size: 2rem; margin-bottom: 13px; opacity: 0.85;
    transition: transform 0.4s var(--ease);
    display: inline-block;
  }
  .dropzone:hover .dz-icon { transform: translateY(-4px) scale(1.08); }
  .dz-title { font-weight: 600; font-size: 1rem; }
  .dz-hint { font-size: 0.84rem; color: var(--paper-faint); margin-top: 7px; }

  .preview-wrap { position: relative; display: none; border-radius: 21px; overflow: hidden; }
  .preview-wrap.show { display: block; animation: popIn 0.45s var(--ease); }
  #preview { display: block; width: 100%; max-height: 340px; object-fit: cover; }
  .scanline {
    position: absolute; left: 0; right: 0; height: 3px; top: 0; display: none;
    background: linear-gradient(90deg, transparent, var(--wheat), transparent);
    box-shadow: 0 0 26px 6px rgba(237,194,90,0.55);
  }
  .scanning .scanline { display: block; animation: scan 1.6s ease-in-out infinite; }
  .scanning::after { content: ""; position: absolute; inset: 0; background: rgba(6,17,10,0.38); }
  @keyframes scan { 0% { top: 0; } 50% { top: calc(100% - 3px); } 100% { top: 0; } }

  .upload-actions { display: flex; gap: 14px; align-items: center; margin-top: 19px; }
  .upload-actions .btn { flex: 1; }

  #report { margin-top: 30px; display: none; }
  #report.show { display: block; }

  .rcard { padding: 26px 28px; margin-bottom: 17px; opacity: 0; transform: translateY(20px) scale(0.99); }
  .rcard.in { animation: riseIn 0.6s var(--ease) forwards; }
  @keyframes riseIn { to { opacity: 1; transform: none; } }

  .rlabel {
    font-family: 'Fraunces', serif; font-style: italic; font-size: 0.89rem;
    color: var(--paper-faint); margin: 0 0 15px;
  }

  .crop-name { font-family: 'Fraunces', serif; font-size: 1.75rem; font-weight: 600; margin: 0; }
  .condition { font-size: 1.06rem; margin: 4px 0 19px; font-weight: 500; }
  .condition.alert { color: var(--brick); }
  .condition.healthy { color: var(--moss); }
  .condition.uncertain { color: var(--slate); }

  .bar { height: 8px; border-radius: 5px; background: rgba(255,255,255,0.1); overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.24); }
  .bar > i {
    display: block; height: 100%; width: 0; border-radius: 5px;
    background: linear-gradient(90deg, var(--moss-deep), var(--moss));
    box-shadow: 0 0 12px rgba(138,198,114,0.45);
    transition: width 1.15s var(--ease);
  }
  .bar.wheat > i { background: linear-gradient(90deg, #B8862A, var(--wheat)); box-shadow: 0 0 12px rgba(237,194,90,0.45); }
  .bar-cap { font-size: 0.82rem; color: var(--paper-faint); margin: 9px 0 0; }

  .pill {
    display: inline-block; font-size: 0.88rem; font-weight: 600;
    padding: 8px 18px; border-radius: var(--radius-pill); border: 1px solid currentColor;
  }
  .pill.moss  { color: var(--moss);  background: rgba(138,198,114,0.11); }
  .pill.slate { color: var(--slate); background: rgba(141,182,214,0.11); }
  .pill.dim   { color: var(--paper-faint); }
  .reason { margin: 15px 0 0; color: var(--paper-dim); font-size: 0.94rem; }

  .figs { display: flex; gap: 13px; flex-wrap: wrap; }
  .fig {
    flex: 1; min-width: 100px;
    background: rgba(255,255,255,0.045);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 16px; padding: 16px 17px;
    transition: background-color 0.3s var(--ease), transform 0.3s var(--ease);
  }
  .fig:hover { background: rgba(255,255,255,0.075); transform: translateY(-2px); }
  .fig b { font-family: 'Fraunces', serif; font-size: 1.5rem; font-weight: 600; display: block; }
  .fig span { font-size: 0.78rem; color: var(--paper-faint); }

  .advice { list-style: none; padding: 0; margin: 18px 0 0; }
  .advice li { position: relative; padding-left: 23px; margin-bottom: 11px; font-size: 0.93rem; color: var(--paper-dim); }
  .advice li:last-child { margin-bottom: 0; }
  .advice li::before {
    content: ""; position: absolute; left: 3px; top: 8px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--wheat);
    box-shadow: 0 0 8px rgba(237,194,90,0.5);
  }

  .score-row { display: flex; align-items: baseline; gap: 11px; margin-bottom: 24px; }
  .score-row b { font-family: 'Fraunces', serif; font-size: 2.8rem; font-weight: 600; line-height: 1; }
  .score-row span { color: var(--paper-faint); font-size: 0.95rem; }

  .sub { margin-bottom: 18px; }
  .sub:last-child { margin-bottom: 0; }
  .sub__head { display: flex; justify-content: space-between; font-size: 0.9rem; margin-bottom: 7px; }
  .sub__head span:last-child { color: var(--paper-dim); }
  .sub__cap { font-size: 0.79rem; color: var(--paper-faint); margin: 7px 0 0; }

  footer { max-width: 880px; margin: 0 auto; padding: 0 28px 48px; font-size: 0.82rem; color: var(--paper-faint); }

  @media (max-width: 720px) {
    .topbar__inner { padding: 13px 18px; gap: 14px; }
    .topbar__right { gap: 13px; }
    .topbar__divider { display: none; }
    .userchip__meta { display: none; }
    main { padding: 34px 18px 80px; }
    .rcard { padding: 22px 20px; }
    footer { padding: 0 18px 40px; }
  }
</style>
</head>
<body>

  <div class="blob blob--moss"></div>
  <div class="blob blob--wheat"></div>
  <div class="blob blob--slate"></div>
  <div class="blob blob--brick"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div id="boot">
  <div class="boot-logo">
    <svg class="boot-logo__icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgriSmart AI">
      <defs>
        <linearGradient id="leafGrad-boot" x1="0%" y1="0%" x2="60%" y2="100%">
          <stop offset="0%" stop-color="#A9DB90" /><stop offset="45%" stop-color="#8AC672" /><stop offset="100%" stop-color="#4E7F3C" />

      <g class="logo-sway">
        <path class="logo-draw logo-draw--outline" d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="none" stroke="#4E7F3C" stroke-width="2.5" />
        <g class="logo-fade">
          <path d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="url(#leafGrad-boot)" />

        <path class="logo-draw" style="animation-delay:1.6s" d="M100 55 Q 82 58, 66 72" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

        <path class="logo-draw" style="animation-delay:1.9s" d="M100 130 Q 82 135, 70 150" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:2.0s" d="M100 55 Q 118 58, 134 72" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:2.1s" d="M100 80 Q 122 82, 142 98" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:2.2s" d="M100 105 Q 124 108, 145 122" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

          <line class="logo-draw" style="animation-delay:3.1s" x1="125" y1="100" x2="100" y2="130" stroke="#EDC25A" stroke-width="1" opacity="0.6" />
          <circle class="logo-fade logo-node" style="animation-delay:2.4s" cx="100" cy="70" r="4" fill="#EDC25A" />
          <circle class="logo-fade logo-node" style="animation-delay:2.6s" cx="75" cy="100" r="3.5" fill="#EDC25A" />
          <circle class="logo-fade logo-node" style="animation-delay:2.8s" cx="125" cy="100" r="3.5" fill="#EDC25A" />
          <circle class="logo-fade logo-node" style="animation-delay:3.0s" cx="100" cy="130" r="4" fill="#EDC25A" />

    </svg>
    <h1 class="boot-logo__text"><span class="boot-logo__agri">AgriSmart</span><span class="boot-logo__ai">AI</span></h1>
  </div>
  <div style="margin-top:6px;"><span class="spinner boot-spin"></span>Loading your account…</div>
</div>

<header class="topbar">
  <div class="topbar__inner">
    <span class="wordmark">
      <svg class="logo-mark" width="26" height="26" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgriSmart AI">
        <defs>
          <linearGradient id="leafGrad-topmark" x1="0%" y1="0%" x2="60%" y2="100%">
            <stop offset="0%" stop-color="#A9DB90" /><stop offset="45%" stop-color="#8AC672" /><stop offset="100%" stop-color="#4E7F3C" />
          </linearGradient>
        </defs>
        <g class="logo-hex"><polygon points="100,25 165,62 165,138 100,175 35,138 35,62" fill="none" stroke="rgba(244,239,224,0.3)" stroke-width="3" stroke-dasharray="8 6" /></g>
        <g class="logo-sway">
          <path d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="url(#leafGrad-topmark)" stroke="#4E7F3C" stroke-width="4" />
          <g class="logo-node-pulse">
            <circle cx="100" cy="80" r="7" fill="#EDC25A" />
            <circle cx="100" cy="120" r="7" fill="#EDC25A" />
          </g>
        </g>
      </svg>
      <span class="dot" id="healthDot"></span>AgriSmart AI
    </span>
    <div class="topbar__right">
      <span class="lang-wrap">
        <select id="langSwitch" class="lang-select" aria-label="Language"></select>
      </span>
      <span class="topbar__divider" aria-hidden="true"></span>
      <div class="userchip">
        <span class="avatar" id="avatar">–</span>
        <span class="userchip__meta">
          <b id="userName">–</b>
          <span id="userLocation">–</span>
        </span>
      </div>
      <button class="linkbtn" id="logoutBtn" data-i18n="logout">Log out</button>
    </div>
  </div>
</header>

<main>
  <div class="hero">
    <h2 data-i18n="hero_heading">Know what's wrong with the crop before you walk the next row.</h2>
    <p data-i18n="hero_sub">Upload a leaf photo. You'll get the disease, today's weather risk, and whether to irrigate — in seconds.</p>
  </div>

  <div class="notice" id="appNotice" role="alert"></div>

  <div class="glass glass--lift upload-card">
    <label class="dropzone" id="dropzone" for="fileInput" tabindex="0">
      <div id="dzIdle">
        <div class="dz-icon">🍃</div>
        <div class="dz-title" data-i18n="dz_title">Drop a leaf photo, or tap to browse</div>
        <div class="dz-hint" data-i18n="dz_hint">JPG or PNG · one leaf, plain background, good light</div>
      </div>
      <div class="preview-wrap" id="previewWrap">
        <img id="preview" alt="Selected leaf photo">
        <span class="scanline"></span>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </label>
    <div class="upload-actions">
      <button class="btn" id="analyzeBtn" disabled><span class="sheen"></span><span class="btn-label" data-i18n="analyze_button">Analyze leaf</span></button>
      <button class="linkbtn" id="resetBtn" style="display:none;" data-i18n="different_photo">Different photo</button>
    </div>
  </div>

  <div id="report">
    <div class="glass glass--lift rcard" id="cardDiagnosis"></div>
    <div class="glass glass--lift rcard" id="cardExplain"></div>
    <div class="glass glass--lift rcard" id="cardAdvice"></div>
    <div class="glass glass--lift rcard" id="cardIrrigation"></div>
    <div class="glass glass--lift rcard" id="cardWeather"></div>
    <div class="glass glass--lift rcard" id="cardSustain"></div>
  </div>
</main>

<footer>Curious Coders · AgriSmart AI · Smart India Hackathon</footer>

<script type="module">
import {
  auth, db, API_BASE, FALLBACK_COORDS, enableGlassHighlight,
  $, showNotice, hideNotice, setLoading
} from "./firebase-config.js";
import { t, getLang, LANGUAGE_NAMES_FOR_PROMPT, mountLanguageSwitch, applyTranslations } from "./i18n.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

enableGlassHighlight();
mountLanguageSwitch($("langSwitch"));
applyTranslations();

const notice = $("appNotice");
let profile = null;
let lastPredictData = null;
let lastRecData = null;

// If the user changes language after results are already shown, refresh the
// static labels immediately. The GenAI text (explanation/advice) stays in
// whatever language it was generated in until the next analysis.
document.addEventListener("agrismart:langchange", () => {
  if (lastPredictData) renderDiagnosis(lastPredictData);
  if (lastRecData) {
    renderIrrigation(lastRecData);
    renderWeather(lastRecData);
    renderSustainability(lastRecData);
  }
});

// ─── Auth guard ────────────────────────────────────────────
async function loadProfile(user) {
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists()) return snap.data();
  } catch { /* Firestore may be disabled; fall through */ }

  const cached = localStorage.getItem(`agrismart:${user.uid}`);
  if (cached) return JSON.parse(cached);

  return {
    name: user.displayName || "Farmer",
    email: user.email || "",
    locationName: FALLBACK_COORDS.label,
    lat: FALLBACK_COORDS.lat,
    lon: FALLBACK_COORDS.lon
  };
}

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.replace("login.html"); return; }

  profile = await loadProfile(user);
  $("userName").textContent = profile.name;
  $("userLocation").textContent = profile.locationName;
  $("avatar").textContent = (profile.name || "F").trim().charAt(0).toUpperCase();
  $("boot").classList.add("hide");
  checkBackend();
});

$("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
  window.location.replace("login.html");
});

// ─── Backend health ────────────────────────────────────────
function checkBackend() {
  fetch(`${API_BASE}/health`)
    .then(r => { if (!r.ok) throw new Error(); $("healthDot").className = "dot ok"; })
    .catch(() => { $("healthDot").className = "dot down"; });
}

// ─── Upload ────────────────────────────────────────────────
const dropzone = $("dropzone"), fileInput = $("fileInput"), previewWrap = $("previewWrap");
const analyzeBtn = $("analyzeBtn"), resetBtn = $("resetBtn"), report = $("report");
let selectedFile = null;

function handleFile(file) {
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    showNotice(notice, t("err_not_image"));
    return;
  }
  selectedFile = file;
  $("preview").src = URL.createObjectURL(file);
  $("dzIdle").style.display = "none";
  previewWrap.classList.add("show");
  analyzeBtn.disabled = false;
  resetBtn.style.display = "inline-block";
  report.classList.remove("show");
  hideNotice(notice);
}

fileInput.addEventListener("change", e => handleFile(e.target.files[0]));
["dragover", "dragenter"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add("drag"); }));
["dragleave", "drop"].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove("drag"); }));
dropzone.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));
dropzone.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
});

resetBtn.addEventListener("click", e => {
  e.preventDefault();
  selectedFile = null;
  lastPredictData = null;
  lastRecData = null;
  fileInput.value = "";
  $("dzIdle").style.display = "block";
  previewWrap.classList.remove("show");
  analyzeBtn.disabled = true;
  resetBtn.style.display = "none";
  report.classList.remove("show");
  hideNotice(notice);
});

// ─── Formatting ────────────────────────────────────────────
// Model labels look like "Apple___Cedar_apple_rust" — split into crop + condition.
function parseLabel(raw) {
  if (!raw || raw === "Uncertain") return { crop: null, condition: null, state: "uncertain" };
  const [cropPart, conditionPart = ""] = raw.split("___");
  const crop = cropPart.replace(/_/g, " ").replace(/\s+/g, " ").trim();
  const condition = conditionPart.replace(/_/g, " ").replace(/\s+/g, " ").trim();
  const healthy = /healthy/i.test(condition);
  return { crop, condition: healthy ? t("no_disease_detected") : condition, state: healthy ? "healthy" : "alert" };
}

function revealCards(ids) {
  ids.forEach((id, i) => {
    const el = $(id);
    el.style.display = el.innerHTML.trim() ? "" : "none";
    el.classList.remove("in");
    void el.offsetWidth;                 // restart the animation
    el.style.animationDelay = `${i * 95}ms`;
    el.classList.add("in");
  });
}

// ─── Render ────────────────────────────────────────────────
function renderDiagnosis(predictData) {
  const info = parseLabel(predictData.disease);
  const pct = Math.round((predictData.confidence || 0) * 100);

  if (info.state === "uncertain") {
    const closest = parseLabel(predictData.raw_prediction || "");
    const hint = closest.crop ? " " + t("closest_match", { crop: closest.crop }) : "";
    $("cardDiagnosis").innerHTML = `
      <p class="rlabel">${t("label_diagnosis")}</p>
      <p class="condition uncertain">${t("uncertain_msg")}${hint}</p>
      <p class="reason">${t("try_again_msg")}</p>
      <div class="bar wheat" style="margin-top:16px"><i data-w="${pct}"></i></div>
      <p class="bar-cap">${t("below_threshold", { pct })}</p>`;
  } else {
    $("cardDiagnosis").innerHTML = `
      <p class="rlabel">${t("label_diagnosis")}</p>
      <p class="crop-name">${info.crop}</p>
      <p class="condition ${info.state}">${info.condition}</p>
      <div class="bar"><i data-w="${pct}"></i></div>
      <p class="bar-cap">${t("confidence_pct", { pct })}</p>`;
  }
  requestAnimationFrame(() => {
    const bar = document.querySelector("#cardDiagnosis .bar > i");
    if (bar) bar.style.width = `${bar.dataset.w}%`;
  });
}

function renderIrrigation(rec) {
  const irr = rec.irrigation || {};
  const action = irr.action || "UNKNOWN";
  const tone = action === "IRRIGATE" ? "slate" : action === "UNKNOWN" ? "dim" : "moss";
  const label = action === "IRRIGATE" ? t("irrigate") : action === "UNKNOWN" ? t("unknown") : t("delay_irrigation");
  $("cardIrrigation").innerHTML = `
    <p class="rlabel">${t("label_irrigation")}</p>
    <span class="pill ${tone}">${label}</span>
    <p class="reason">${irr.reason || ""}</p>`;
}

function renderWeather(rec) {
  const w = rec.weather || {};
  if (w.error) {
    $("cardWeather").innerHTML = `<p class="rlabel">${t("label_weather")}</p><p class="reason">${w.error}</p>`;
    return;
  }
  const advice = (w.advice || []).map(a => `<li>${a}</li>`).join("");
  $("cardWeather").innerHTML = `
    <p class="rlabel">${t("label_weather")} · ${profile?.locationName || ""}</p>
    <div class="figs">
      <div class="fig"><b>${w.temperature_c ?? "—"}°</b><span>${t("temperature")}</span></div>
      <div class="fig"><b>${w.humidity_pct ?? "—"}%</b><span>${t("humidity")}</span></div>
      <div class="fig"><b>${w.rain_probability_pct ?? "—"}%</b><span>${t("rain_chance")}</span></div>
    </div>
    <ul class="advice">${advice}</ul>`;
}

function renderSustainability(rec) {
  const s = rec.sustainability || {};
  const b = s.breakdown || {}, w = s.weights || {};
  const row = (key, label) => `
    <div class="sub">
      <div class="sub__head"><span>${label}</span><span>${b[key] ?? "—"} / 100</span></div>
      <div class="bar"><i data-w="${b[key] ?? 0}"></i></div>
      <p class="sub__cap">${t("contributes_pct", { pct: Math.round((w[key] || 0) * 100) })}</p>
    </div>`;
  $("cardSustain").innerHTML = `
    <p class="rlabel">${t("label_sustainability")}</p>
    <div class="score-row"><b>${s.score ?? "—"}</b><span>${t("out_of_100")}</span></div>
    ${row("crop_health", t("label_crop_health"))}
    ${row("water_efficiency", t("label_water_efficiency"))}
    ${row("resource_usage", t("label_resource_usage"))}`;
  requestAnimationFrame(() => {
    document.querySelectorAll("#cardSustain .bar > i").forEach(bar => { bar.style.width = `${bar.dataset.w}%`; });
  });
}

// Explanation + advice are generated by an LLM, but strictly grounded in the
// numbers already computed above -- it interprets them, it doesn't invent new
// facts. Generated directly in the farmer's selected language.
async function renderExplanation(predictData, recData) {
  const info = parseLabel(predictData.disease);
  try {
    const res = await fetch(`${API_BASE}/explain`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        crop: info.crop,
        condition: info.condition,
        confidence: predictData.confidence,
        irrigation: recData.irrigation,
        weather: recData.weather,
        sustainability: recData.sustainability,
        language: LANGUAGE_NAMES_FOR_PROMPT[getLang()] || "English",
      }),
    });
    const data = await res.json();

    $("cardExplain").innerHTML = data.explanation
      ? `<p class="rlabel">${t("label_plain_words")}</p><p class="reason">${data.explanation}</p>`
      : "";

    const steps = data.next_steps || [];
    $("cardAdvice").innerHTML = steps.length
      ? `<p class="rlabel">${t("label_what_to_do")}</p><ul class="advice">${steps.map(s => `<li>${s}</li>`).join("")}</ul>`
      : "";
  } catch {
    $("cardExplain").innerHTML = "";
    $("cardAdvice").innerHTML = "";
  }
}

// ─── Analyze ───────────────────────────────────────────────
analyzeBtn.addEventListener("click", async () => {
  if (!selectedFile) return;
  hideNotice(notice);
  setLoading(analyzeBtn, true);
  previewWrap.classList.add("scanning");
  report.classList.remove("show");

  const body = new FormData();
  body.append("image", selectedFile);

  try {
    const predictData = await (await fetch(`${API_BASE}/predict`, { method: "POST", body })).json();
    if (predictData.error) { showNotice(notice, predictData.error); return; }

    lastPredictData = predictData;
    renderDiagnosis(predictData);

    // An uncertain reading gives no disease to reason about, so skip the advice call.
    if (predictData.disease !== "Uncertain") {
      const recData = await (await fetch(`${API_BASE}/recommendation`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          disease: predictData.disease,
          lat: profile?.lat ?? FALLBACK_COORDS.lat,
          lon: profile?.lon ?? FALLBACK_COORDS.lon,
          soil_moisture: 40
        })
      })).json();
      lastRecData = recData;
      renderIrrigation(recData);
      renderWeather(recData);
      renderSustainability(recData);
      await renderExplanation(predictData, recData);
    } else {
      lastRecData = null;
      ["cardExplain", "cardAdvice", "cardIrrigation", "cardWeather", "cardSustain"].forEach(id => { $(id).innerHTML = ""; });
    }

    report.classList.add("show");
    revealCards(["cardDiagnosis", "cardExplain", "cardAdvice", "cardIrrigation", "cardWeather", "cardSustain"]);
    $("cardDiagnosis").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch {
    showNotice(notice, t("err_server"));
  } finally {
    previewWrap.classList.remove("scanning");
    setLoading(analyzeBtn, false, "analyze_button");
  }
});
</script>
