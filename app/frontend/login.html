<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · AgriSmart AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .auth-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 18px; }
  .auth-wrap { width: 100%; max-width: 430px; animation: fadeUp 0.55s var(--ease); }

  .lang-corner { position: fixed; top: 22px; right: 24px; z-index: 30; }

  .brand { text-align: center; margin-bottom: 26px; }
  .brand__mark { width: 72px; height: 72px; margin: 0 auto 16px; }
  .brand h1 { font-size: 1.72rem; }
  .brand p { margin: 7px 0 0; color: var(--paper-dim); font-size: 0.94rem; }

  .tabs {
    display: flex; position: relative;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius-sm);
    padding: 4px; margin-bottom: 24px;
  }
  .tabs__glider {
    position: absolute; top: 4px; bottom: 4px; left: 4px;
    width: calc(50% - 4px); border-radius: 11px;
    background: linear-gradient(140deg, rgba(255,255,255,0.24), rgba(255,255,255,0.09));
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    transition: transform 0.45s var(--ease);
  }
  .tabs.signup .tabs__glider { transform: translateX(100%); }
  .tab {
    flex: 1; position: relative; z-index: 1;
    background: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 0.93rem; font-weight: 500;
    color: var(--paper-dim); padding: 11px 0;
    transition: color 0.3s ease;
  }
  .tab[aria-selected="true"] { color: var(--paper); }

  .auth-card { padding: 28px 26px 26px; }
  .pane { display: none; }
  .pane.active { display: block; animation: fadeUp 0.4s var(--ease); }
  .pane h2 { font-size: 1.22rem; margin-bottom: 4px; }
  .pane-sub { color: var(--paper-dim); font-size: 0.9rem; margin: 0 0 22px; }

  .helper { font-size: 0.79rem; color: var(--paper-faint); margin: 6px 0 0; }
  .loc-chip { display: none; align-items: center; gap: 8px; margin-top: 9px; font-size: 0.82rem; color: var(--moss); }
  .loc-chip.show { display: flex; animation: popIn 0.3s var(--ease); }

  @media (max-width: 540px) { .auth-card { padding: 24px 20px; } }
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="blob blob--moss"></div>
  <div class="blob blob--wheat"></div>
  <div class="blob blob--slate"></div>
  <div class="blob blob--brick"></div>
</div>
<div class="grain" aria-hidden="true"></div>

<div class="lang-corner">
  <span class="lang-wrap">
    <select id="langSwitch" class="lang-select" aria-label="Language"></select>
  </span>
</div>

<div id="boot">
  <div class="boot-logo">
    <svg class="boot-logo__icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgriSmart AI">
      <defs>
        <linearGradient id="leafGrad-boot" x1="0%" y1="0%" x2="60%" y2="100%">
          <stop offset="0%" stop-color="#A9DB90" /><stop offset="45%" stop-color="#8AC672" /><stop offset="100%" stop-color="#4E7F3C" />
        </linearGradient>
        <linearGradient id="leafHighlight-boot" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F4EFE0" stop-opacity="0.5" /><stop offset="50%" stop-color="#F4EFE0" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="veinGrad-boot" x1="50%" y1="0%" x2="50%" y2="100%">
          <stop offset="0%" stop-color="#F4EFE0" /><stop offset="100%" stop-color="#C9E8B8" />
        </linearGradient>
        <radialGradient id="glowGrad-boot" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#EDC25A" stop-opacity="0.45" /><stop offset="100%" stop-color="#EDC25A" stop-opacity="0" />
        </radialGradient>
      </defs>
      <circle class="logo-glow" cx="100" cy="100" r="70" fill="url(#glowGrad-boot)" />
      <g class="logo-hex"><polygon points="100,25 165,62 165,138 100,175 35,138 35,62" fill="none" stroke="rgba(244,239,224,0.35)" stroke-width="1.5" stroke-dasharray="6 4" /></g>
      <g class="logo-sway">
        <path class="logo-draw logo-draw--outline" d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="none" stroke="#4E7F3C" stroke-width="2.5" />
        <g class="logo-fade">
          <path d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="url(#leafGrad-boot)" />
          <path d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="url(#leafHighlight-boot)" />
        </g>
        <path class="logo-draw" style="animation-delay:1.5s" d="M100 40 L 100 166" fill="none" stroke="url(#veinGrad-boot)" stroke-width="2" stroke-linecap="round" />
        <path class="logo-draw" style="animation-delay:1.6s" d="M100 55 Q 82 58, 66 72" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:1.7s" d="M100 80 Q 78 82, 58 98" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:1.8s" d="M100 105 Q 76 108, 55 122" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:1.9s" d="M100 130 Q 82 135, 70 150" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:2.0s" d="M100 55 Q 118 58, 134 72" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:2.1s" d="M100 80 Q 122 82, 142 98" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:2.2s" d="M100 105 Q 124 108, 145 122" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <path class="logo-draw" style="animation-delay:2.3s" d="M100 130 Q 118 135, 130 150" fill="none" stroke="#F4EFE0" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
        <g class="logo-nodes">
          <line class="logo-draw" style="animation-delay:2.5s" x1="100" y1="70" x2="75" y2="100" stroke="#EDC25A" stroke-width="1" opacity="0.6" />
          <line class="logo-draw" style="animation-delay:2.7s" x1="100" y1="70" x2="125" y2="100" stroke="#EDC25A" stroke-width="1" opacity="0.6" />
          <line class="logo-draw" style="animation-delay:2.9s" x1="75" y1="100" x2="100" y2="130" stroke="#EDC25A" stroke-width="1" opacity="0.6" />
          <line class="logo-draw" style="animation-delay:3.1s" x1="125" y1="100" x2="100" y2="130" stroke="#EDC25A" stroke-width="1" opacity="0.6" />
          <circle class="logo-fade logo-node" style="animation-delay:2.4s" cx="100" cy="70" r="4" fill="#EDC25A" />
          <circle class="logo-fade logo-node" style="animation-delay:2.6s" cx="75" cy="100" r="3.5" fill="#EDC25A" />
          <circle class="logo-fade logo-node" style="animation-delay:2.8s" cx="125" cy="100" r="3.5" fill="#EDC25A" />
          <circle class="logo-fade logo-node" style="animation-delay:3.0s" cx="100" cy="130" r="4" fill="#EDC25A" />
        </g>
        <path class="logo-draw" style="animation-delay:2.4s" d="M100 168 Q 100 178, 97 192" fill="none" stroke="#4E7F3C" stroke-width="3" stroke-linecap="round" />
      </g>
    </svg>
    <h1 class="boot-logo__text"><span class="boot-logo__agri">AgriSmart</span><span class="boot-logo__ai">AI</span></h1>
  </div>
  <div style="margin-top:6px;"><span class="spinner boot-spin"></span>Checking your session…</div>
</div>

<section class="auth-page">
  <div class="auth-wrap">
    <div class="brand">
      <div class="brand__mark">
        <svg class="logo-mark" width="72" height="72" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AgriSmart AI">
          <defs>
            <linearGradient id="leafGrad-mark" x1="0%" y1="0%" x2="60%" y2="100%">
              <stop offset="0%" stop-color="#A9DB90" /><stop offset="45%" stop-color="#8AC672" /><stop offset="100%" stop-color="#4E7F3C" />
            </linearGradient>
            <linearGradient id="leafHighlight-mark" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#F4EFE0" stop-opacity="0.5" /><stop offset="50%" stop-color="#F4EFE0" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g class="logo-hex"><polygon points="100,25 165,62 165,138 100,175 35,138 35,62" fill="none" stroke="rgba(244,239,224,0.3)" stroke-width="2" stroke-dasharray="7 5" /></g>
          <g class="logo-sway">
            <path d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="url(#leafGrad-mark)" stroke="#4E7F3C" stroke-width="3" />
            <path d="M100 35 C 65 45, 42 80, 44 120 C 46 150, 70 172, 100 168 C 130 172, 154 150, 156 120 C 158 80, 135 45, 100 35 Z" fill="url(#leafHighlight-mark)" />
            <path d="M100 40 L 100 166" stroke="#F4EFE0" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
            <g class="logo-node-pulse">
              <circle cx="100" cy="70" r="5" fill="#EDC25A" />
              <circle cx="75" cy="100" r="4.5" fill="#EDC25A" />
              <circle cx="125" cy="100" r="4.5" fill="#EDC25A" />
              <circle cx="100" cy="130" r="5" fill="#EDC25A" />
            </g>
          </g>
        </svg>
      </div>
      <h1>AgriSmart AI</h1>
      <p data-i18n="tagline">Spot crop disease from a single leaf photo.</p>
    </div>

    <div class="glass glass--lift auth-card">
      <div class="tabs" id="tabs" role="tablist">
        <span class="tabs__glider" aria-hidden="true"></span>
        <button class="tab" id="tabLogin"  role="tab" aria-selected="true"  aria-controls="paneLogin" data-i18n="tab_login">Log in</button>
        <button class="tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="paneSignup" data-i18n="tab_signup">Create account</button>
      </div>

      <div class="notice" id="authNotice" role="alert"></div>

      <div class="pane active" id="paneLogin" role="tabpanel">
        <h2 data-i18n="login_heading">Welcome back</h2>
        <p class="pane-sub" data-i18n="login_sub">Log in with the email you registered.</p>

        <div class="field">
          <label for="loginEmail" data-i18n="label_email">Email</label>
          <div class="input-shell">
            <input type="email" id="loginEmail" autocomplete="email" placeholder="you@example.com">
          </div>
        </div>

        <div class="field">
          <label for="loginPassword" data-i18n="label_password">Password</label>
          <div class="input-shell">
            <input type="password" id="loginPassword" autocomplete="current-password">
            <button type="button" class="ghost" data-toggle="loginPassword" data-i18n="show">Show</button>
          </div>
        </div>

        <button class="btn" id="loginBtn"><span class="sheen"></span><span class="btn-label" data-i18n="login_button">Log in</span></button>
      </div>

      <div class="pane" id="paneSignup" role="tabpanel">
        <h2 data-i18n="signup_heading">Create your account</h2>
        <p class="pane-sub" data-i18n="signup_sub">Your location lets us tailor weather and irrigation advice.</p>

        <div class="field">
          <label for="suName" data-i18n="label_name">Full name</label>
          <div class="input-shell">
            <input type="text" id="suName" autocomplete="name" placeholder="Jeel Kumar">
          </div>
        </div>

        <div class="field">
          <label for="suEmail" data-i18n="label_email">Email</label>
          <div class="input-shell">
            <input type="email" id="suEmail" autocomplete="email" placeholder="you@example.com">
          </div>
        </div>

        <div class="field">
          <label for="suPassword" data-i18n="label_password">Password</label>
          <div class="input-shell">
            <input type="password" id="suPassword" autocomplete="new-password">
            <button type="button" class="ghost" data-toggle="suPassword" data-i18n="show">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="suLocation" data-i18n="label_location">Village or district</label>
          <div class="input-shell">
            <input type="text" id="suLocation" autocomplete="address-level2" placeholder="Anand, Gujarat">
            <button type="button" class="ghost" id="useGpsBtn" data-i18n="use_gps">Use GPS</button>
          </div>
          <p class="helper" data-i18n="helper_location">We look up coordinates for weather. GPS is more precise.</p>
          <div class="loc-chip" id="locChip">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="locChipText"></span>
          </div>
        </div>

        <button class="btn" id="signupBtn"><span class="sheen"></span><span class="btn-label" data-i18n="signup_button">Create account</span></button>
      </div>
    </div>
  </div>
</section>

<script type="module">
import {
  auth, db, FALLBACK_COORDS, authMessage, enableGlassHighlight,
  $, showNotice, hideNotice, setLoading
} from "./firebase-config.js";
import { t, mountLanguageSwitch, applyTranslations } from "./i18n.js";
import {
  createUserWithEmailAndPassword, signInWithEmailAndPassword,
  onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

enableGlassHighlight();
mountLanguageSwitch($("langSwitch"));
applyTranslations();

const notice = $("authNotice");
const isValidEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v || "").trim());

// Already signed in? Skip straight to the app.
onAuthStateChanged(auth, user => {
  if (user) { window.location.replace("index.html"); return; }
  $("boot").classList.add("hide");
});

// ─── Tabs ──────────────────────────────────────────────────
function selectTab(which) {
  const isSignup = which === "signup";
  $("tabs").classList.toggle("signup", isSignup);
  $("tabLogin").setAttribute("aria-selected", String(!isSignup));
  $("tabSignup").setAttribute("aria-selected", String(isSignup));
  $("paneLogin").classList.toggle("active", !isSignup);
  $("paneSignup").classList.toggle("active", isSignup);
  hideNotice(notice);
}
$("tabLogin").addEventListener("click", () => selectTab("login"));
$("tabSignup").addEventListener("click", () => selectTab("signup"));

// ─── Password visibility ───────────────────────────────────
document.querySelectorAll("[data-toggle]").forEach(btn => {
  btn.addEventListener("click", () => {
    const input = $(btn.dataset.toggle);
    const hidden = input.type === "password";
    input.type = hidden ? "text" : "password";
    btn.textContent = hidden ? t("hide") : t("show");
  });
});

// ─── Location ──────────────────────────────────────────────
let pickedCoords = null;

$("useGpsBtn").addEventListener("click", () => {
  if (!navigator.geolocation) {
    showNotice(notice, t("err_gps_unsupported"));
    return;
  }
  const btn = $("useGpsBtn");
  const originalLabel = btn.textContent;
  btn.textContent = "…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      pickedCoords = { lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4) };
      btn.textContent = originalLabel;
      $("locChipText").textContent = t("loc_pinned");
      $("locChip").classList.add("show");
    },
    () => {
      btn.textContent = originalLabel;
      showNotice(notice, t("err_gps_failed"));
    },
    { timeout: 8000 }
  );
});

// Turn a typed place name into coordinates (Open-Meteo geocoding, no key needed).
async function geocode(placeName) {
  try {
    const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(placeName)}&count=1&language=en`;
    const data = await (await fetch(url)).json();
    const hit = data?.results?.[0];
    return hit ? { lat: +hit.latitude.toFixed(4), lon: +hit.longitude.toFixed(4) } : null;
  } catch { return null; }
}

// ─── Sign up ───────────────────────────────────────────────
$("signupBtn").addEventListener("click", async () => {
  hideNotice(notice);
  const name     = $("suName").value.trim();
  const email    = $("suEmail").value.trim();
  const password = $("suPassword").value;
  const locName  = $("suLocation").value.trim();

  if (name.length < 2)      return showNotice(notice, t("err_name"));
  if (!isValidEmail(email)) return showNotice(notice, t("err_email"));
  if (password.length < 6)  return showNotice(notice, t("err_password_len"));
  if (!locName && !pickedCoords) return showNotice(notice, t("err_location"));

  setLoading($("signupBtn"), true);
  try {
    let coords = pickedCoords;
    if (!coords && locName) coords = await geocode(locName);
    if (!coords) coords = { lat: FALLBACK_COORDS.lat, lon: FALLBACK_COORDS.lon };

    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await updateProfile(cred.user, { displayName: name });

    const record = {
      name, email,
      locationName: locName || "GPS location",
      lat: coords.lat, lon: coords.lon
    };
    try {
      await setDoc(doc(db, "users", cred.user.uid), { ...record, createdAt: new Date().toISOString() });
    } catch {
      // Firestore may not be enabled — the account still works.
      localStorage.setItem(`agrismart:${cred.user.uid}`, JSON.stringify(record));
    }
    // onAuthStateChanged redirects to index.html from here.
  } catch (err) {
    showNotice(notice, authMessage(err.code));
    setLoading($("signupBtn"), false, "signup_button");
  }
});

// ─── Log in ────────────────────────────────────────────────
$("loginBtn").addEventListener("click", async () => {
  hideNotice(notice);
  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if (!isValidEmail(email)) return showNotice(notice, t("err_email"));
  if (!password)            return showNotice(notice, t("err_password_required"));

  setLoading($("loginBtn"), true);
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    showNotice(notice, authMessage(err.code));
    setLoading($("loginBtn"), false, "login_button");
  }
});

// Enter submits the visible pane.
document.querySelectorAll("input").forEach(input => {
  input.addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if ($("paneSignup").classList.contains("active")) $("signupBtn").click();
    else $("loginBtn").click();
  });
});
</script>
</body>
</html>
